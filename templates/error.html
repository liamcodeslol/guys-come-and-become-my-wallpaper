<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Something went wrong</title>
<link rel="icon" type="image/png" href="/favicon">

<style>
    html,
    body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;

        background:
            linear-gradient(
                rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.55)
            ),
            url("/wallpaper") center center / cover no-repeat fixed;

        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    .page {
        min-height: 100vh;
        box-sizing: border-box;

        display: flex;
        flex-direction: column;
        justify-content: center;

        padding: 48px 7vw;
    }

    .small {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        margin-bottom: 30px;
        color: #ddd;
    }

    h1 {
        max-width: 1050px;
        margin: 0 0 34px;

        font-size: clamp(48px, 8vw, 110px);
        line-height: 0.91;
        letter-spacing: -0.065em;
        font-weight: 800;
    }

    p {
        max-width: 580px;

        font-size: 18px;
        line-height: 1.55;

        margin: 0 0 28px;

        color: #ddd;
    }

    .button {
        width: fit-content;

        background: white;
        color: #111;

        padding: 15px 20px;

        text-decoration: none;

        font-size: 14px;
        font-weight: 700;

        transition: opacity 0.2s ease;
    }

    .button:hover {
        opacity: 0.85;
    }

    .footer {
        position: fixed;
        left: 7vw;
        bottom: 32px;

        display: flex;
        align-items: center;
    }

    .github-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        color: #ffffff;
        text-decoration: none;

        font-size: 11px;
        font-weight: 700;

        letter-spacing: 0.08em;
        text-transform: uppercase;

        transition:
            opacity 0.2s ease,
            transform 0.2s ease;
    }

    .github-link:hover {
        color: #ffffff;
        opacity: 0.75;
        transform: translateY(-1px);
    }

    .github-icon {
        width: 20px;
        height: 20px;

        fill: #ffffff;

        flex-shrink: 0;
    }

    @media (max-width: 600px) {
        .page {
            padding: 40px 7vw;
        }

        h1 {
            font-size: clamp(44px, 15vw, 72px);
        }

        p {
            font-size: 16px;
        }

        .footer {
            left: 7vw;
            bottom: 24px;
        }

        .github-link {
            font-size: 9px;
        }

        .github-icon {
            width: 18px;
            height: 18px;
        }
    }
</style>


</head>

<body>


<main class="page">

    <div class="small">
        ERROR
    </div>

    <h1>
        something went wrong.
    </h1>

    <p>
        {{ message }}
    </p>

    <a class="button" href="/">
        try again →
    </a>

</main>

<footer class="footer">
    <a
        href="https://github.com/liamcodeslol/guys-come-and-become-my-wallpaper"
        target="_blank"
        rel="noopener noreferrer"
        class="github-link"
    >
        <svg
            class="github-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.604-2.665-.303-5.467-1.332-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.292-1.552 3.295-1.23 3.295-1.23.648 1.653.24 2.873.12 3.176.765.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.624-5.48 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .316.216.69.825.572C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12z"/>
        </svg>

        <span>
            Go to open source project on GitHub!
        </span>
    </a>
</footer>


</body>
</html>
