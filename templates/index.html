
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner }}'s Wallpaper</title>
<link rel="icon" type="image/png" href="/favicon">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("/wallpaper") center center / cover no-repeat fixed;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px 7vw;
        }

.github-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #fff;
    text-decoration: none;

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;

    transition: opacity 0.2s ease, transform 0.2s ease;
}

.github-link:hover {
    color: #fff;
    opacity: 0.75;
    transform: translateY(-1px);
}

.github-icon {
    width: 20px;
    height: 20px;
    fill: #fff;
    flex-shrink: 0;
}

        .small {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.16em;
            margin-bottom: 30px;
            color: #ddd;
        }

        h1 {
            max-width: 1050px;
            margin: 0 0 34px;
            font-size: clamp(48px, 8vw, 110px);
            line-height: 0.91;
            letter-spacing: -0.065em;
            font-weight: 800;
        }

        p {
            max-width: 580px;
            font-size: 18px;
            line-height: 1.55;
            margin: 0 0 28px;
            color: #ddd;
        }

        .button {
            width: fit-content;
            background: white;
            color: #111;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .button:hover {
            opacity: 0.85;
        }

        .footer {
            position: absolute;
            bottom: 32px;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #aaa;
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="small">LIAM'S WALLPAPER</div>

        <h1>
            you're invited<br>
            to be on my wallpaper.
        </h1>

        <p>
            authorize Discord and your profile picture
            will automatically appear on my desktop wallpaper.
        </p>

        <a class="button" href="/join">
            authorize Discord →
        </a>

<div class="footer">
    <a
        href="https://github.com/liamcodeslol/guys-come-and-become-my-wallpaper"
        target="_blank"
        rel="noopener noreferrer"
        class="github-link"

        <span>Go to open source project on GitHub!</span>
    </a>
</div>
    </main>
</body>
</html>
